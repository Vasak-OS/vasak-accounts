<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the name. The daemon hands out account tokens, so a
       program that could claim the name would be handed the requests instead. -->
  <policy user="root">
    <allow own="ar.net.vasak.os.AccountManager"/>
  </policy>

  <!-- Anyone may ask. Every method scopes itself to the calling user, and
       reaching a token additionally goes through the permission service. -->
  <policy context="default">
    <allow send_destination="ar.net.vasak.os.AccountManager"
           send_interface="ar.net.vasak.os.AccountManager"/>
    <allow send_destination="ar.net.vasak.os.AccountManager"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="ar.net.vasak.os.AccountManager"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
