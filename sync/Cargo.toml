[package]
name = "vasak-accounts-sync"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
description = "Mantiene al día el correo de las cuentas en línea, como servicio del usuario"

[dependencies]
# Los directorios base del estándar, para que la regla de que una variable
# relativa o vacía se ignora viva en un solo lugar y no en una copia por módulo.
dirs = "7"
# Sanear el HTML de un mensaje, que lo escribió un desconocido. Parsea con el
# mismo motor que un navegador y reescribe desde el árbol, que es lo que cierra
# la familia de ataques que un recortador por texto deja pasar. Ver `html.rs`.
ammonia = "4"
# Para copiar el `src` de las imágenes antes de sanear. Ver `html.rs`.
regex = "1"
zbus.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio-rustls.workspace = true
rustls-native-certs.workspace = true
# Para el usuario y la contraseña de las cuentas con contraseña de aplicación,
# y para el XOAUTH2 de las que usan token.
base64 = "0.23"
# Para el flujo de señales de D-Bus, y para leer una imagen a medida que llega
# sin pasarse del tope.
futures-util = "0.3"
# Para traer las imágenes de un correo cuando la persona las pide. El mismo
# cliente que ya usa el servicio de cuentas del mismo espacio de trabajo, con
# rustls: es Rust puro y no suma bibliotecas compartidas al paquete.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
# Para mirar la dirección de una imagen antes de pedirla. Ver `images.rs`.
url.workspace = true
# Los juegos de caracteres del correo. Medio correo viejo viene en latin-1, y sin
# convertirlo un mensaje en español de hace quince años se ve con un rombo en
# cada acento. Es Rust puro —el mismo motor de codificaciones de Firefox—, así
# que no suma ninguna biblioteca compartida al paquete.
encoding_rs = "0.8"

# Para caché global de conversiones de consultas FTS (requiere feature "std" para Lazy).
once_cell = { version = "1.19", features = ["std"] }
# El almacén local cifrado, una base por cuenta. SQLCipher compilado junto con el
# programa —la versión la fija el `Cargo.lock`— y enlazado contra el OpenSSL del
# sistema, que sigue recibiendo los parches de la distribución. Es la única
# dependencia del sync que suma una biblioteca compartida al paquete:
# `libcrypto.so.3`. Ver `store/mod.rs`.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
# Las migraciones del esquema, sobre `user_version` y no sobre una tabla propia.
rusqlite_migration = "2.6"
# La clave de cada base, puesta en cero al soltarla.
zeroize = "1"
# Los 32 bytes al azar de cada clave, del generador del sistema operativo.
getrandom = "0.4"
# Borrar bajo `stores/` relativo a un descriptor abierto sin seguir enlaces
# (`openat`, `unlinkat`), y el límite de volcados (`RLIMIT_CORE`) al arrancar. Ya estaba en el
# candado por zbus —la misma versión y las mismas funciones—, así que no suma
# ninguna crate; y habla con el kernel sin pasar por la libc, así que tampoco
# suma bibliotecas compartidas. Sin `unsafe` de este lado.
rustix = { version = "1", features = ["fs", "process"] }
# El XML de CardDAV (`PROPFIND`, `REPORT`, `multistatus`). Rust puro y de sólo
# lectura, sin ninguna biblioteca compartida; rechaza la DTD por omisión, que es
# lo que cierra las entidades externas y las expansiones en cadena. Es la misma
# que usaba `vasak-contacts`, de donde viene el parser. Ver `dav/webdav.rs`.
roxmltree.workspace = true
# Las repeticiones de los eventos del calendario (`RRULE`, RFC 5545). Rust puro,
# sin ninguna biblioteca compartida; se le da la hora de pared y la zona la
# pone `ical/timezones.rs`, y sus topes no alcanzan solos: ver
# `ical/recurrence.rs`. Trae `regex`, que ya estaba, y `thiserror` y `log`.
rrule = "0.14"
# La base de datos de zonas horarias de IANA, compilada adentro del binario: un
# evento con `TZID=Europe/Madrid` cae a la hora de Madrid, horario de verano
# incluido. La misma que usaba `vasak-calendar`, de donde viene `zonas.rs`. No
# suma ninguna biblioteca compartida. Ver `ical/timezones.rs`.
chrono-tz = "0.10"
# El momento de arranque de un proceso y la pregunta a `vasak-permissions`,
# compartidos con el servicio de cuentas. Ver `common/` y `access.rs`.
vasak-accounts-common.workspace = true
# Cliente LDAP para sincronización de contactos contra Active Directory.
# default-features = false para evitar native-tls; tls-rustls-ring para LDAPS con rustls+ring.
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
# S/MIME (vasak-mail#78). Todo RustCrypto puro, sin bibliotecas compartidas
# nuevas (verificado con `readelf`: el único NEEDED fuera de la libc sigue
# siendo `libcrypto.so.3`, de SQLCipher). Van pineados a la generación der-0.7:
# `cms` 0.2 fija esa línea (x509-cert 0.2, spki 0.7, pkcs5 0.7, pkcs8 0.10), y
# no se mezcla con la der-0.8 (0.3/0.8) para no duplicar der/x509/aes/cbc en el
# árbol. `cms` va sin `builder` acá: PR2 sólo parsea el `.p12`; firmar y cifrar
# (que sí piden `builder`) son PR3/PR4. Ver `store/smime_key.rs`.
# `kdf` para derivar la clave del MAC del PFX (HMAC con el KDF de PKCS#12) y
# verificarlo antes de confiar en el contenido del `.p12`. Ver `verify_mac`.
pkcs12 = { version = "0.1", features = ["kdf"] }
# `builder` para armar y verificar SignedData/PKCS#7 (firmar/verificar correo,
# PR3). Ver `smime_sign.rs`.
cms = { version = "0.2", features = ["builder"] }
pkcs5 = { version = "0.7", features = ["pbes2", "alloc"] }
pkcs8 = { version = "0.10", features = ["encryption", "alloc"] }
der = { version = "0.7", features = ["alloc", "oid"] }
const-oid = { version = "0.9", features = ["db"] }
spki = { version = "0.7", features = ["alloc"] }
# La firma: RSA (PKCS#1 v1.5) y ECDSA P-256, para firmar con la clave propia y
# verificar las de terceros (las dos formas aparecen en el correo real). Rust
# puro, misma generación der-0.7 (ecdsa 0.16 / p256 0.13), sin soname nuevo.
rsa = { version = "0.9", features = ["sha2"] }
ecdsa = { version = "0.16", features = ["der"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
x509-cert = "0.2"
signature = "2"
# El HMAC del MAC del `.p12` y su hash. Ya estaban en el candado (los trae
# `pbkdf2`/`pkcs5`): no suman crate nueva ni biblioteca compartida.
# Descifrar S/MIME (EnvelopedData, PR4): AES-CBC del contenido y SHA-1 para OAEP
# heredado. Rust puro, misma generación der-0.7, ya venían transitivas por
# `cms`-builder (aes/cbc) y `rsa` (sha1 vía oaep) — no suman soname. `readelf` lo
# confirma. Ver `smime_sign::decrypt_message`.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
sha1 = "0.10"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
# Leer la superficie de `AccountsSync` y `AccountsStore` desde su `Introspect`,
# para las pruebas que las fijan. Ver `common/src/introspection.rs`.
vasak-accounts-common = { workspace = true, features = ["introspection"] }
# Las conexiones punto a punto de zbus, para probar el cliente del llavero y la
# interfaz del almacén contra un servidor falso, sin `dbus-daemon`. Con
# `bus-impl`, que sólo habilita ponerle nombre único a una punta —lo que haría
# el bus—: el permiso de lectura se decide por el remitente, y sin nombre no
# hay remitente. No suma ninguna crate.
zbus = { workspace = true, features = ["p2p", "bus-impl"] }
# El reloj de tokio en modo pausado, que es lo que permite demostrar que una
# base se cierra **sin** que corran los 300 segundos de la revisión
# (`start_paused`, en `lifecycle.rs`). `full` no trae `test-util`, y no se
# agrega a las dependencias normales porque eso también entra en el binario que
# se instala; acá sólo se suma para las pruebas.
tokio = { workspace = true, features = ["test-util"] }
# Para el servidor LDAP de mentira de las pruebas (`contacts_sync/ldap_fake.rs`):
# `lber` es la biblioteca de BER que `ldap3` ya usa por dentro, así que las
# respuestas que arma son bytes LDAP legítimos y no suma ninguna crate nueva;
# `bytes` es el buffer que pide su codificador. Sólo para las pruebas.
lber = "0.5"
bytes = "1"
