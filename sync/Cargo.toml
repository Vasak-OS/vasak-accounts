[package]
name = "vasak-accounts-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Mantiene al día el correo de las cuentas en línea, como servicio del usuario"

[dependencies]
# Sanear el HTML de un mensaje, que lo escribió un desconocido. Parsea con el
# mismo motor que un navegador y reescribe desde el árbol, que es lo que cierra
# la familia de ataques que un recortador por texto deja pasar. Ver `html.rs`.
ammonia = "4"
# Para copiar el `src` de las imágenes antes de sanear. Ver `html.rs`.
regex = "1"
zbus.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio-rustls.workspace = true
rustls-native-certs.workspace = true
# Para el usuario y la contraseña de las cuentas con contraseña de aplicación,
# y para el XOAUTH2 de las que usan token.
base64 = "0.22"
# Para el flujo de señales de D-Bus, y para leer una imagen a medida que llega
# sin pasarse del tope.
futures-util = "0.3"
# Para traer las imágenes de un correo cuando la persona las pide. El mismo
# cliente que ya usa el servicio de cuentas del mismo espacio de trabajo, con
# rustls: es Rust puro y no suma bibliotecas compartidas al paquete.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# Para mirar la dirección de una imagen antes de pedirla. Ver `imagenes.rs`.
url.workspace = true
# Los juegos de caracteres del correo. Medio correo viejo viene en latin-1, y sin
# convertirlo un mensaje en español de hace quince años se ve con un rombo en
# cada acento. Es Rust puro —el mismo motor de codificaciones de Firefox—, así
# que no suma ninguna biblioteca compartida al paquete.
encoding_rs = "0.8"
